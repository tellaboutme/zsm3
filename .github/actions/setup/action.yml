name: Setup toolchain
description: Install pnpm, Node.js, uv and every locked dependency.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version
        cache: pnpm
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      with:
        enable-cache: false
    - name: Install Node.js dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install Python dependencies
      shell: bash
      run: uv sync --directory tools --locked
